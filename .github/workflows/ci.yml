name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore AgentProof.sln

      - name: Build solution
        run: dotnet build AgentProof.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test AgentProof.sln -c Release --no-build

      - name: Pack tool package
        run: dotnet pack src/AgentProof.Cli/AgentProof.Cli.csproj -c Release --no-build -o artifacts/packages

      - name: Upload tool package
        uses: actions/upload-artifact@v4
        with:
          name: AgentProof-package-${{ github.sha }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14

  windows-build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore dependencies
        run: dotnet restore AgentProof.sln

      - name: Build solution
        run: dotnet build AgentProof.sln -c Release --no-restore

      - name: Run tests (Unit and Portable MCP Integration)
        run: dotnet test AgentProof.sln -c Release --no-build
